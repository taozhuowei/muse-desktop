[package]
name = "muse-desktop"
version = "0.2.1"
description = "Lightweight Tauri desktop wrapper for muse.ai"
authors = ["tao"]
edition = "2021"

# See more keys and their definitions at
# https://doc.rust-lang.org/cargo/reference/manifest.html
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = "0.13"
semver = "1"
windows-sys = { version = "0.61", features = [
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
] }
tauri-plugin-notification = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = "0.62.2"

[profile.release]
# Keep the binary small. This is a WebView shell, it does not need
# debug symbols or a large runtime of its own.
strip = true
opt-level = "s"
